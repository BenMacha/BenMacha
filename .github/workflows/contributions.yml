name: Open source contributions

on:
  schedule:
    # Hourly: a pull request merged in another repository cannot trigger this one.
    - cron: "17 * * * *"
  workflow_dispatch:
  # Editing the data or the scripts redraws everything right away.
  push:
    branches: [main]
    paths:
      - "profile-contrib/profile.json"
      - "scripts/**"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-figures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both scripts keep the last good data when an API cannot be read.
      - name: Read contributions and packages, rebuild the README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contributions.py
      - name: Read the GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/github_stats.py
      # The figures (scripts/anatomy-book/) use the technical book design of benmacha.tn: Node built-ins only
      - name: Draw the figures
        run: |
          node scripts/orgs_machine.mjs
          node scripts/stack_machine.mjs
          node scripts/packages_machine.mjs profile-contrib/packages.json
          node scripts/pr_machine.mjs profile-contrib/stats.json
          node scripts/pr_cabinet_machine.mjs profile-contrib/stats.json
          node scripts/github_stats_machine.mjs profile-contrib/github-stats.json
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md profile-contrib
          # Commits only when the README, the data or a drawing changed.
          if git commit -m "Update open source contributions"; then
            git pull --rebase
            git push
          fi
